<!DOCTYPE html>
<html>
<head>
    <title>Riemann Zeta Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Riemann Zeta Function Calculator</h1>
    <form method="post">
        <label for="sigma">Real Part (σ):</label>
        <input type="number" step="any" name="sigma" required><br>
        <label for="t">Imaginary Part (t):</label>
        <input type="number" step="any" name="t" required><br>
        <button type="submit">Compute ζ(s)</button>
    </form>
</body>
