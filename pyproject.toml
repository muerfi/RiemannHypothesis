[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riemann-lab"
version = "0.1.0"
description = "Riemann Zeta Computational Observatory: finite numerical experiments with zeta zeros and prime counting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "muerfi/RiemannHypothesis contributors" }]
dependencies = [
    "mpmath>=1.3,<2",
    # Keep CI on Python 3.10-3.12 insulated from future NumPy major releases
    # that may raise their minimum supported Python version.
    "numpy>=1.26,<2.3",
]
keywords = ["riemann-zeta", "number-theory", "prime-counting", "computational-mathematics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
visualization = ["matplotlib>=3.7", "plotly>=5", "dash>=2"]
ml = ["scikit-learn>=1.3", "tensorflow>=2"]
quantum = ["scipy>=1.10"]
web = ["flask>=2"]

[project.scripts]
riemann-lab = "riemann_lab.cli:main"

[tool.setuptools.packages.find]
include = ["riemann_lab*"]
